# Deploys the Supabase Edge Functions whenever they change.
# Needs repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
name: Deploy Supabase Edge Functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0   # pinned: a new CLI release never runs with your access token unreviewed
      - run: supabase functions deploy process-spreadsheet --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --use-api
      - run: supabase functions deploy send-email --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --use-api
