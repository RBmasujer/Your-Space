# Free Supabase projects pause after 7 days without activity.
# This pings a harmless database function every 3 days so the project stays awake.
# Needs repository secrets: SUPABASE_URL, SUPABASE_ANON_KEY (both are public values).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 1 */3 * *'   # 09:17 Manila time, every 3 days
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
